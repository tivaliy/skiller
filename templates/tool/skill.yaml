# The skill id you run with /skill. Skiller's New Skill command keeps it equal to the folder name.
id: __SKILL_ID__
# Display name shown in the skill picker.
name: __SKILL_NAME__
# One line telling people what this skill does.
description: Write notes and save them to a file with a tool
# Your own version number for the skill.
version: "0.1.0"

# Inputs are values collected before the skill runs.
inputs:
  # `name` is how steps refer to it, e.g. {{ inputs.<name> }}.
  - name: topic
    # `type` is the value's kind (string here).
    type: string
    description: What the notes are about
    # `required` inputs are always asked for if they are empty.
    required: true
    # `prompt` is the question shown when Skiller asks for the value.
    prompt: "What should the notes be about?"

# Tool aliases map a friendly name to a real tool.
tools:
  aliases:
    # Built-in tool that ships with Skiller: always available.
    create_file: skiller_createFile
    # To use an MCP tool you configured in VS Code, add its real name:
    #   search: my_mcp_searchTool
    # A trailing `?` makes the tool optional: if it is missing you only get a
    # warning and the skill can still run (the step just runs without that tool):
    #   notify: my_mcp_notify?

# Steps run top to bottom; each stores its result under its `output` name.
steps:
  - id: write_notes
    # `type: llm` sends a prompt to the model; `file` holds the prompt, `output` names the result.
    type: llm
    description: Write notes and save them with the tool
    file: steps/01-write-notes.md
    # The model may call these tool aliases during this step.
    tools: [create_file]
    # `auto`: the model decides. `required`: it must call a tool.
    tool_mode: required
    output: result

# On a step failure: `abort` stops the run, `continue` moves on.
on_error: abort

# The final message shown in chat once every step has finished.
output:
  summary: "{{ outputs.result }}"
